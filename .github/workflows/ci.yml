name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancel in-progress runs on same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===========================================================================
  # QUALITY GATE - BLOCKING
  # This job MUST pass for PR to be mergeable
  # ===========================================================================
  quality:
    name: Quality Gate (BLOCKING)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9.12.2

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (BLOCKING)
        run: pnpm lint

      - name: Type Check (BLOCKING)
        run: pnpm typecheck

      - name: Test with Coverage (BLOCKING)
        run: pnpm -r test -- --coverage
        env:
          CI: true

      - name: Verify Coverage Thresholds (BLOCKING)
        run: |
          echo "Checking coverage thresholds..."
          # Coverage is enforced by vitest.config.ts thresholds
          # If thresholds are not met, the previous step fails
          echo "Coverage thresholds passed"

      - name: Build (BLOCKING)
        run: pnpm build

  # ===========================================================================
  # SMOKE TEST - BLOCKING
  # Verifies critical integrations work
  # ===========================================================================
  smoke-test:
    name: Smoke Test (BLOCKING)
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9.12.2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

      - name: Verify analysis-agent exports
        run: |
          cd packages/analysis-agent
          node -e "
            const pkg = require('./dist/index.js');
            const required = ['AnalysisAgent'];
            const missing = required.filter(e => !pkg[e]);
            if (missing.length) {
              console.error('Missing exports:', missing);
              process.exit(1);
            }
            console.log('All required exports present');
          "

      - name: Verify server starts (BLOCKING)
        run: |
          cd packages/server
          # Start server in background with timeout
          timeout 10s node dist/index.js &
          SERVER_PID=$!
          sleep 3

          # Check if server process is still running (basic smoke test)
          if kill -0 $SERVER_PID 2>/dev/null; then
            echo "Server started successfully"
            # Attempt health check but don't fail if endpoint doesn't exist
            curl -f http://localhost:3000/health 2>/dev/null || echo "Note: /health endpoint not available (acceptable)"
            pkill -f "node dist/index.js" || true
            exit 0
          else
            echo "CRITICAL: Server failed to start"
            exit 1
          fi

  # ===========================================================================
  # CRITICAL FILES GUARD - BLOCKING
  # Fails if critical files are modified without proper justification
  # ===========================================================================
  critical-files-guard:
    name: Critical Files Guard (BLOCKING)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for critical file changes
        id: critical
        run: |
          CRITICAL_FILES=$(git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }} | grep -E "^packages/analysis-agent/src/(agent|orchestrator)\.ts$|^packages/analysis-agent/src/governance/|^packages/analysis-agent/src/validators/|^packages/server/src/index\.ts$" || true)

          if [ -n "$CRITICAL_FILES" ]; then
            echo "critical=true" >> $GITHUB_OUTPUT
            echo "files<<EOF" >> $GITHUB_OUTPUT
            echo "$CRITICAL_FILES" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
            echo "::warning::Critical files modified: $CRITICAL_FILES"
          else
            echo "critical=false" >> $GITHUB_OUTPUT
          fi

      - name: Verify justification in PR body
        if: steps.critical.outputs.critical == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const prBody = context.payload.pull_request.body || '';
            const requiredSections = [
              'justificativa',
              'justification',
              'reason',
              'motivo'
            ];

            const hasJustification = requiredSections.some(section =>
              prBody.toLowerCase().includes(section)
            );

            if (!hasJustification) {
              core.setFailed(`
              ❌ BLOCKED: Critical files modified without justification.

              Modified files:
              ${{ steps.critical.outputs.files }}

              To unblock, add a "Justification" section to your PR description explaining:
              - Why these files need to be modified
              - What testing was done
              - What risks were considered
              `);
            } else {
              console.log('✅ Justification found in PR body');
            }

  # ===========================================================================
  # LARGE DELETION GUARD - BLOCKING
  # Fails if too many lines are deleted without justification
  # ===========================================================================
  large-deletion-guard:
    name: Large Deletion Guard (BLOCKING)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check deletion size
        id: diff
        run: |
          DELETED=$(git diff --numstat ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }} | awk '{sum+=$2} END {print sum+0}')
          echo "deleted=$DELETED" >> $GITHUB_OUTPUT
          echo "Deleted lines: $DELETED"

      - name: Block large deletions without justification
        if: steps.diff.outputs.deleted > 300
        uses: actions/github-script@v7
        with:
          script: |
            const deleted = ${{ steps.diff.outputs.deleted }};
            const prBody = context.payload.pull_request.body || '';

            const hasJustification = prBody.toLowerCase().includes('deletion') ||
                                     prBody.toLowerCase().includes('removed') ||
                                     prBody.toLowerCase().includes('cleanup') ||
                                     prBody.toLowerCase().includes('refactor');

            if (!hasJustification) {
              core.setFailed(`
              ❌ BLOCKED: ${deleted} lines deleted without justification.

              Large deletions (>300 lines) require documentation.

              Add to your PR description:
              - What was removed and why
              - Confirmation that no functionality was lost
              - Verification that tests still cover important cases
              `);
            } else {
              console.log(`✅ Large deletion (${deleted} lines) justified in PR body`);
            }

  # ===========================================================================
  # FINAL STATUS - Required for merge
  # ===========================================================================
  ci-status:
    name: CI Status
    runs-on: ubuntu-latest
    needs: [quality, smoke-test]
    if: always()

    steps:
      - name: Check all jobs passed
        run: |
          if [ "${{ needs.quality.result }}" != "success" ]; then
            echo "❌ Quality gate failed"
            exit 1
          fi
          if [ "${{ needs.smoke-test.result }}" != "success" ]; then
            echo "❌ Smoke test failed"
            exit 1
          fi
          echo "✅ All required checks passed"
